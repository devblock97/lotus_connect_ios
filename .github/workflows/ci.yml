name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Checking current default Xcode..."
          xcodebuild -version || true
          
          # If iphonesimulator SDK is not available in current Xcode, find one that supports it
          if ! xcrun --sdk iphonesimulator --show-sdk-path >/dev/null 2>&1; then
            echo "Current Xcode does not have iphonesimulator SDK. Searching for compatible Xcode..."
            for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
              if [ -d "$xc/Contents/Developer/Platforms/iPhoneSimulator.platform" ]; then
                echo "Switching to $xc"
                sudo xcode-select -s "$xc"
                if xcrun --sdk iphonesimulator --show-sdk-path >/dev/null 2>&1; then
                  break
                fi
              fi
            done
          fi
          
          echo "Active Xcode Version:"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('lotus_connect_ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Enable Swift Macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project lotus_connect_ios.xcodeproj \
            -scheme lotus_connect_ios \
            -skipMacroValidation

      - name: Build App & Test Targets
        run: |
          xcodebuild build-for-testing \
            -project lotus_connect_ios.xcodeproj \
            -scheme lotus_connect_ios \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -quiet
